<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>💰 Expense Tracker</h1>
      <div class="month-picker">
        <label for="monthFilter">Month</label>
        <input type="month" id="monthFilter" />
      </div>
    </header>

    <section class="summary-cards">
      <div class="card income">
        <span class="card-label">Income</span>
        <span class="card-value" id="totalIncome">₹0</span>
      </div>
      <div class="card expense">
        <span class="card-label">Expenses</span>
        <span class="card-value" id="totalExpense">₹0</span>
      </div>
      <div class="card balance">
        <span class="card-label">Balance</span>
        <span class="card-value" id="totalBalance">₹0</span>
      </div>
    </section>

    <main class="grid">
      <section class="panel">
        <h2>Add Transaction</h2>
        <form id="transactionForm">
          <div class="form-row">
            <label>Type</label>
            <select id="type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>
          <div class="form-row">
            <label>Amount</label>
            <input type="number" id="amount" step="0.01" min="0" required />
          </div>
          <div class="form-row">
            <label>Category</label>
            <select id="categoryId" required></select>
          </div>
          <div class="form-row">
            <label>Date</label>
            <input type="date" id="date" required />
          </div>
          <div class="form-row">
            <label>Note</label>
            <input type="text" id="note" placeholder="Optional note" />
          </div>
          <button type="submit">Add Transaction</button>
        </form>

        <h2 class="section-gap">Manage Categories</h2>
        <form id="categoryForm" class="inline-form">
          <input type="text" id="newCategoryName" placeholder="Category name" required />
          <input type="color" id="newCategoryColor" value="#6b7280" />
          <button type="submit">Add</button>
        </form>
        <ul id="categoryList" class="category-list"></ul>

        <h2 class="section-gap">Budgets</h2>
        <form id="budgetForm" class="inline-form">
          <select id="budgetCategory" required></select>
          <input type="number" id="budgetLimit" placeholder="Monthly limit" min="0" required />
          <button type="submit">Set</button>
        </form>
        <ul id="budgetList" class="budget-list"></ul>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Spending by Category</h2>
        </div>
        <canvas id="categoryChart" height="220"></canvas>

        <div class="panel-header section-gap">
          <h2>Transactions</h2>
          <div class="filters">
            <input type="text" id="searchNote" placeholder="Search notes..." />
            <select id="filterType">
              <option value="">All types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
            <button id="exportCsv">Export CSV</button>
          </div>
        </div>
        <ul id="transactionList" class="transaction-list"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
